<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101322">
<title>Shivi Assistant — Websitewire</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--bg:#fff;--panel:#fff;--text:#202124;--muted:#70757a;--line:#e5e7eb;--soft:#f7f8fa;--accent:#2563eb}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:4;padding:12px 18px;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.head-left{display:flex;align-items:center;gap:12px}
#menuToggle{font-size:20px;padding:8px 12px;background:transparent;border:0;color:var(--text)}
#chatMenu{position:fixed;z-index:10;inset:0 auto 0 0;width:min(300px,85vw);max-height:100dvh;overflow:auto;padding:18px;background:#fff;border-right:1px solid var(--line);box-shadow:12px 0 35px #00000012;border-radius:0}
#chatMenu[hidden]{display:none}
#chatMenu h3{font-size:14px;color:var(--muted);margin:22px 4px 8px}
#newChat{width:100%;text-align:left;background:var(--soft);color:var(--text);border-color:var(--line)}
#historyList{display:flex;flex-direction:column;gap:6px}
#historyList button{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:white;color:var(--text);border-color:var(--line)}
header a{color:var(--text);text-decoration:none}.brand{font-weight:750;font-size:19px}
.brand small{display:none}
small{display:block;color:var(--muted);font-weight:400;font-size:12px}
main{width:min(850px,100%);margin:auto;padding:24px 16px;flex:1;display:flex;flex-direction:column}
h1{text-align:center;font-size:clamp(28px,5vw,42px);margin:24px 0 8px}.sub{text-align:center;color:var(--muted);margin:0 0 28px}
#messages{display:flex;flex-direction:column;gap:16px;flex:1}
.msg{padding:13px 16px;border:1px solid var(--line);border-radius:18px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;color:var(--text)}
.user{background:#eff6ff;border-color:#dbeafe;align-self:flex-end;max-width:90%}.assistant{align-self:stretch;background:#fff}
.sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sources a{color:var(--accent);font-size:13px}
.composer{margin-top:20px;background:#fff;border:1px solid #d7dbe2;border-radius:24px;padding:10px;box-shadow:0 4px 18px #00000008}
.composer textarea{width:100%;resize:vertical;min-height:56px;max-height:180px;background:transparent;color:var(--text);border:0;outline:0;padding:10px;font:inherit}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.actions div{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:white;color:var(--text);border-radius:12px;padding:9px 13px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
button:disabled{opacity:.5}
#status{font-size:13px;color:var(--muted);min-height:24px;padding:8px 2px}
footer{text-align:center;color:#9299a2;font-size:12px;padding:18px}
img.generated{display:block;width:100%;max-width:600px;border-radius:12px;margin-top:12px}
@media(max-width:480px){header{padding:10px 12px}main{padding:16px 12px}.actions button{padding:8px 10px}}

.tool-area{position:relative}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:10px;background:#f3f4f6;border:1px solid var(--line);color:var(--text)}
.icon-btn svg,.tools-menu svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.send-btn{background:var(--accent);color:white;border-color:var(--accent)}
.tools-menu{position:absolute;bottom:54px;left:0;z-index:8;width:190px;padding:7px;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #00000018}
.tools-menu[hidden]{display:none}
.tools-menu button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:white;padding:11px;border-radius:10px}
.tools-menu button:hover{background:var(--soft)}

.loading-dots{display:inline-flex;align-items:center;gap:6px;min-width:54px;min-height:28px}
.loading-dots i{width:8px;height:8px;border-radius:50%;background:#8b8b98;animation:shiviPulse 1.1s infinite ease-in-out}
.loading-dots i:nth-child(2){animation-delay:.15s}
.loading-dots i:nth-child(3){animation-delay:.3s}
@keyframes shiviPulse{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}
</style>
</head>
<body>
<header>
<div class="head-left">
<button type="button" id="menuToggle" aria-label="Open chat menu">☰</button>
<a class="brand" href="/">✦ Shivi Assistant</a>
</div>
<a href="/multi-tools/">← Multi Tools</a>
</header>
<aside id="chatMenu" aria-label="Chat menu" hidden>
<button type="button" id="newChat">＋ New Chat</button>
<h3>Chat History</h3>
<div id="historyList"></div>
</aside>
<main>
<h1>How can I help <span style="color:#a99cff">you today?</span></h1>
<p class="sub">Ask questions, research topics, or create an image.</p>
<section id="messages" aria-live="polite"></section>
<div id="status" role="status"></div>
<form class="composer" id="form">
<textarea id="prompt" placeholder="Message Shivi Assistant…" aria-label="Your message" required></textarea>
<div class="actions">
<div class="tool-area">
<button type="button" id="plusTools" class="icon-btn" aria-label="More tools" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toolsMenu" class="tools-menu" hidden>
<button type="button" id="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg>Voice</button>
<button type="button" id="image"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Create image</button>
<button type="button" id="camera"><svg viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg>Camera</button>
<button type="button" id="attach"><svg viewBox="0 0 24 24"><path d="m21 11.5-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.5 5.8l-9 9a2 2 0 0 1-2.8-2.8l8-8"/></svg>File</button>
</div>
<input type="file" id="file" hidden accept="image/*,.pdf,.docx,.txt,.md,.html,.htm,.css,.js,.mjs,.json,.xml,.csv,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.cs,.php,.go,.rs,.sql,.sh,.yml,.yaml,.toml,.log,.svg">
<input type="file" id="cameraFile" hidden accept="image/*" capture="environment">
</div>
<button class="primary icon-btn send-btn" id="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>
<div id="filename" style="font-size:12px;color:#a5acc4"></div>
</form>
</main>
<footer>Made for Deepak Kumar · Websitewire</footer>
<script>
(function(){
const API='https://shivi-assistant-backend.onrender.com';
const form=document.querySelector('#form'),prompt=document.querySelector('#prompt'),messages=document.querySelector('#messages'),status=document.querySelector('#status'),send=document.querySelector('#send');
let busy=false;
let currentChatId=String(Date.now());
const HISTORY_KEY='shiviAssistantChatHistory';
function getHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return []}}
function saveCurrentChat(){
  const items=[...messages.querySelectorAll('.msg')].map(el=>({who:el.classList.contains('user')?'user':'assistant',text:el.innerText||el.textContent||''}));
  if(!items.length)return;
  let history=getHistory();
  const title=(items.find(x=>x.who==='user')?.text||'New Chat').slice(0,55);
  history=history.filter(x=>x.id!==currentChatId);
  history.unshift({id:currentChatId,title,items,updated:Date.now()});
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,50)));
  renderHistory();
}
function renderHistory(){
  const list=document.querySelector('#historyList');
  list.replaceChildren();
  getHistory().forEach(chat=>{
    const b=document.createElement('button');
    b.type='button';b.textContent=chat.title||'Chat';
    b.addEventListener('click',()=>{
      messages.replaceChildren();
      currentChatId=chat.id;
      (chat.items||[]).forEach(item=>message(item.text,item.who));
      document.querySelector('#chatMenu').hidden=true;
      status.textContent='';
    });
    list.appendChild(b);
  });
}
document.querySelector('#menuToggle').addEventListener('click',()=>{
  const menu=document.querySelector('#chatMenu');
  menu.hidden=!menu.hidden;
  if(!menu.hidden)renderHistory();
});
document.querySelector('#newChat').addEventListener('click',()=>{
  saveCurrentChat();
  currentChatId=String(Date.now())+'-'+Math.random().toString(36).slice(2,7);
  messages.replaceChildren();
  prompt.value='';
  status.textContent='';
  document.querySelector('#filename').textContent='';
  document.querySelector('#chatMenu').hidden=true;
  prompt.focus();
});
renderHistory();

function message(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;messages.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});return el;}
async function request(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||'Request failed ('+r.status+')');return d;}
async function run(text,makeImage){
if(busy||!text.trim())return;busy=true;send.disabled=true;message(makeImage?'Create image: '+text:text,'user');prompt.value='';const reply=message('','assistant');
reply.innerHTML='<span class="loading-dots" role="status" aria-label="Shivi is working"><i></i><i></i><i></i></span>';
status.textContent=makeImage?'Generating your image…':'';
try{
const d=await request(makeImage?'/api/image':'/api/chat',makeImage?{prompt:text}:{message:text});
if(makeImage){const url=d.imageUrl||d.url||(d.images&&d.images[0]&&d.images[0].url);reply.textContent=url?'Your image is ready:':'Image service returned no image URL.';if(url){const img=document.createElement('img');img.className='generated';img.src=url;img.alt=text;reply.appendChild(img);}}
else{reply.textContent=d.answer||d.response||'No answer returned.';if(Array.isArray(d.sources)&&d.sources.length){const box=document.createElement('div');box.className='sources';d.sources.forEach(s=>{try{const u=new URL(s.url);if(!['http:','https:'].includes(u.protocol))return;const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=s.title||u.hostname;box.appendChild(a);}catch(e){}});reply.appendChild(box);}}
status.textContent='';
}catch(e){reply.textContent='Could not connect: '+e.message;status.textContent='Please check your connection and try again.';}
finally{saveCurrentChat();busy=false;send.disabled=false;prompt.focus();}
}
const plusTools=document.querySelector('#plusTools');
const toolsMenu=document.querySelector('#toolsMenu');
plusTools.addEventListener('click',()=>{
  toolsMenu.hidden=!toolsMenu.hidden;
  plusTools.setAttribute('aria-expanded',String(!toolsMenu.hidden));
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.tool-area')){
    toolsMenu.hidden=true;
    plusTools.setAttribute('aria-expanded','false');
  }
});
toolsMenu.querySelectorAll('button').forEach(b=>{
  b.addEventListener('click',()=>{
    toolsMenu.hidden=true;
    plusTools.setAttribute('aria-expanded','false');
  });
});
form.addEventListener('submit',e=>{e.preventDefault();run(prompt.value,false);});
document.querySelector('#image').addEventListener('click',()=>{if(!prompt.value.trim()){status.textContent='Please describe the image first.';prompt.focus();return;}run(prompt.value,true);});
document.querySelector('#attach').addEventListener('click',()=>document.querySelector('#file').click());
async function analyzeFile(f){
  if(!f)return;
  const label=document.querySelector('#filename');
  label.textContent='Analyzing '+f.name+'…';
  const question=prompt.value.trim()||'Please explain this file briefly.';
  message('Analyze file: '+f.name,'user');
  const reply=message('Shivi is reading the file…','assistant');
  status.textContent='Analyzing file…';
  send.disabled=true;
  try{
    const data=new FormData();
    data.append('file',f);
    data.append('question',question);
    const r=await fetch(API+'/api/upload',{method:'POST',body:data});
    const d=await r.json();
    if(!r.ok)throw Error(d.error||'File analysis failed');
    reply.textContent=d.answer||'No answer returned.';
    label.textContent='Analyzed: '+f.name;
    prompt.value='';
    status.textContent='';
  }catch(err){
    reply.textContent='Could not analyze file: '+err.message;
    label.textContent='File: '+f.name;
    status.textContent='Please try another file.';
  }finally{
    send.disabled=false;
    document.querySelector('#file').value='';
    document.querySelector('#cameraFile').value='';
    saveCurrentChat();
    prompt.focus();
  }
}
document.querySelector('#file').addEventListener('change',e=>analyzeFile(e.target.files[0]));
document.querySelector('#cameraFile').addEventListener('change',e=>analyzeFile(e.target.files[0]));
document.querySelector('#camera').addEventListener('click',()=>document.querySelector('#cameraFile').click());
document.querySelector('#voice').addEventListener('click',()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Voice input is not supported in this browser.';return;}const rec=new SR();rec.lang='en-IN';rec.onresult=e=>{prompt.value=e.results[0][0].transcript;status.textContent='Voice captured. Press Send to continue.';};rec.onerror=()=>status.textContent='Voice input could not start. You can type instead.';rec.start();status.textContent='Listening…';});
})();
</script>
</body>
</html>
