<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Websitewire | Simple Solutions</title>
  <meta name="description" content="Websitewire helps you find solutions to everyday problems.">
  <link rel="icon" href="/Website_wire.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #fff;
      line-height: 1.6;
    }
    header {
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: bold;
      text-decoration: none;
      color: #172033;
    }
    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    nav { display: flex; gap: 18px; flex-wrap: wrap; }
    nav a { color: #334155; text-decoration: none; }
    nav a:hover { color: #1769ff; }
    .welcome {
      text-align: center;
      padding: 75px 20px;
      background: #f3f7ff;
    }
    h1 { font-size: clamp(30px, 5vw, 46px); margin: 0 0 12px; }
    .welcome p { color: #5b6575; margin: 0; }
    main { max-width: 900px; margin: auto; padding: 35px 20px; }
    .ad-slot {
      min-height: 100px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #64748b;
      padding: 15px;
      margin: 0 auto 30px;
    }
    footer {
      padding: 25px 20px;
      text-align: center;
      background: #172033;
      color: white;
    }
    footer a { color: white; margin: 0 8px; text-decoration: none; }
    @media (max-width: 600px) {
      header { justify-content: center; }
      nav { justify-content: center; }
      .welcome { padding: 55px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Websitewire home">
      <img src="/Website_wire.png" alt="Websitewire logo">
      <span>Websitewire</span>
    </a>
    <nav>
      <a href="/">Home</a>
      <a href="#articles">Articles</a>
      <a href="#about">About</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <section class="welcome">
    <h1>Welcome to Websitewire</h1>
    <p>Find helpful information and solutions to everyday problems.</p>
  </section>

  <main>
    <!-- Google AdSense placement: add your approved ad code here later. -->
    <div class="ad-slot">
      Google AdSense space
    </div>

    <section id="articles">
      <!-- Your article images, titles and links will be added here later. -->
    </section>

    <section id="about">
      <h2>About Websitewire</h2>
      <p>A simple place to find helpful solutions.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 Websitewire</p>
    <a href="/privacy-policy/">Privacy Policy</a>
    <a href="/disclaimer/">Disclaimer</a>
    <a href="/contact/">Contact</a>
  </footer>
</body>
</html>
