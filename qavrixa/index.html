<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Qavrixa — Live Chat</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--line:#29364d;--cyan:#67e8f9;--purple:#a78bfa;--muted:#9ba9bd}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1b2543,#090d18 60%);color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #ffffff15}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:23px}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b1020}
.status{font-size:12px;color:#a7f3d0}
main{max-width:850px;margin:auto;padding:45px 14px}
.intro{text-align:center;margin-bottom:28px}
h1{font-size:clamp(36px,8vw,55px);letter-spacing:-2px;margin:10px 0}
h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple));background-clip:text;color:transparent}
.intro p{color:var(--muted);font-size:14px}
.card{max-width:700px;margin:auto;border:1px solid #344158;border-radius:22px;background:#0d1423;overflow:hidden;box-shadow:0 25px 80px #0005}
.top{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
#state{font-size:12px;color:var(--cyan)}
.join{padding:14px;display:flex;gap:9px;border-bottom:1px solid var(--line)}
input{min-width:0;background:#111b2b;border:1px solid #344158;border-radius:12px;padding:13px;color:white;font:inherit;outline:none}
input:focus{border-color:var(--cyan)}
#name{width:125px}
#room{flex:1}
button{border:0;border-radius:12px;padding:0 17px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0b1020;font-weight:800;cursor:pointer}
#messages{height:360px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:13px}
.info{text-align:center;color:var(--muted);font-size:12px;padding:5px}
.msg{align-self:flex-start;max-width:85%}
.msg.mine{align-self:flex-end}
.author{font-size:11px;color:var(--cyan);margin:0 4px 5px}
.mine .author{text-align:right;color:var(--purple)}
.bubble{background:#1a2639;border-radius:14px 14px 14px 4px;padding:11px 14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.mine .bubble{background:#443a8a;border-radius:14px 14px 4px 14px}
.time{font-size:10px;color:#8290a5;margin:5px 4px 0}
.composer{padding:13px;display:flex;gap:9px;border-top:1px solid var(--line)}
#message{flex:1}
#send{padding:0 20px}
footer{text-align:center;color:#718096;font-size:11px;padding:18px}
@media(max-width:500px){header{padding:0 15px}main{padding:35px 10px}.join{gap:6px;padding:10px}#name{width:88px;padding:11px 8px}#room{padding:11px 8px}button{padding:0 11px}#messages{height:340px;padding:14px}.composer{padding:10px;gap:6px}#message{padding:12px 9px}#send{padding:0 13px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">q</div>qavrixa</div><div class="status">● <span id="connection">Connecting…</span></div></header>
<main>
<section class="intro"><h1>Chat in <span>real time.</span></h1><p>One link. Two phones. Start a conversation.</p></section>
<section class="card">
<div class="top"><div><strong id="roomTitle">Public Lounge</strong><div class="sub">Share the same room name with your friend</div></div><div id="state">Connecting…</div></div>
<form class="join" id="joinForm"><input id="name" maxlength="24" placeholder="Your name" aria-label="Your name" required><input id="room" maxlength="40" placeholder="Room name" aria-label="Room name" value="lounge" required><button>Join</button></form>

<div style="padding:14px;border-bottom:1px solid var(--line)">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button type="button" id="startAudioCall">🎙️ Audio Call</button>
    <button type="button" id="startVideoCall">📹 Video Call</button>
    <button type="button" id="answerCall" disabled>Answer Call</button>
    <button type="button" id="endCall" disabled>End Call</button>
  </div>
  <div id="callStatus" role="status" style="margin-top:10px;font-size:13px">Join a room before calling.</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <video id="localVideo" autoplay muted playsinline style="display:none;width:46%;max-height:180px;background:#111;border-radius:10px"></video>
    <video id="remoteVideo" autoplay playsinline style="display:none;width:46%;max-height:180px;background:#111;border-radius:10px"></video>
  </div>
</div>

<div id="messages" aria-live="polite"><div class="info">Connecting to Qavrixa…</div></div>
<form class="composer" id="chatForm"><input id="message" maxlength="500" placeholder="Write a message…" aria-label="Message" autocomplete="off" required disabled><button id="send" disabled>Send ↗</button></form>
</section>
</main>
<footer>Qavrixa · Be kind. Keep conversations respectful.</footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, push, set, query, limitToLast, onChildAdded, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvu2g98m6hg33HOvV7jSUY5X9Kt4AuP50",
  authDomain: "qavrixa-8522f.firebaseapp.com",
  databaseURL: "https://qavrixa-8522f-default-rtdb.firebaseio.com",
  projectId: "qavrixa-8522f",
  storageBucket: "qavrixa-8522f.firebasestorage.app",
  messagingSenderId: "735119570267",
  appId: "1:735119570267:web:18de69ff4fcca5f000167e"
};

const $ = id => document.getElementById(id);
const messagesEl = $("messages");
let db, user, activeRoom = "", stopListening = null, joined = false;
const shown = new Set();
const cleanRoom = s => s.trim().toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,40);
function showError(message) {
  $("state").textContent = message;
  $("connection").textContent = "Connection issue";
}
function addMessage(data, key) {
  if (shown.has(key)) return;
  shown.add(key);
  if (messagesEl.querySelector(".info")) messagesEl.innerHTML = "";
  const row = document.createElement("div");
  row.className = "msg" + (data.uid === user.uid ? " mine" : "");
  const author = document.createElement("div");
  author.className = "author";
  author.textContent = data.name || "Guest";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = data.text || "";
  const time = document.createElement("div");
  time.className = "time";
  time.textContent = data.time ? new Date(data.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Just now";
  row.append(author,bubble,time);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  db = getDatabase(app);
  await signInAnonymously(auth);
  user = auth.currentUser;
  $("connection").textContent = "Connected";
  $("state").textContent = "Ready to chat";
} catch (error) {
  showError("Sign-in failed");
  console.error(error);
}
$("joinForm").addEventListener("submit", event => {
  event.preventDefault();
  if (!user || !db) return showError("Firebase not connected");
  const room = cleanRoom($("room").value);
  const name = $("name").value.trim().slice(0,24);
  if (!room || !name) return;
  if (stopListening) stopListening();
  activeRoom = room;
  joined = true;
  shown.clear();
  messagesEl.innerHTML = '<div class="info">Loading messages…</div>';
  $("roomTitle").textContent = "Room: " + room;
  $("room").value = room;
  $("state").textContent = "Room joined";
  $("message").disabled = false;
  $("send").disabled = false;
  const roomQuery = query(ref(db, "messages/" + room), limitToLast(100));
  stopListening = onChildAdded(roomQuery, snapshot => addMessage(snapshot.val() || {}, snapshot.key), error => showError("Cannot read messages"));
});
$("chatForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!joined || !user || !db || !activeRoom) return showError("Join a room first");
  const text = $("message").value.trim();
  const name = $("name").value.trim().slice(0,24);
  if (!text || !name) return;
  $("send").disabled = true;
  try {
    await push(ref(db, "messages/" + activeRoom), {
      uid: user.uid, name, text: text.slice(0,500), time: serverTimestamp()
    });
    $("message").value = "";
  } catch (error) {
    showError("Message not sent");
    console.error(error);
  } finally {
    $("send").disabled = false;
  }
});

// Basic 1-to-1 WebRTC audio/video calls using Firebase as signaling.
let peer = null;
let localStream = null;
let currentCallId = null;
let currentCallRef = null;
let callMode = "audio";
let stopCallList = null;
let stopCallDoc = null;
let stopRemoteCandidates = null;
let seenIncomingCall = "";
let settingRemoteAnswer = false;
let pendingCandidates = [];

const callText = text => { $("callStatus").textContent = text; };

function callPath(room, id) {
  return "calls/" + room + "/" + id;
}

function closeMediaOnly() {
  if (peer) {
    peer.ontrack = null;
    peer.onicecandidate = null;
    peer.onconnectionstatechange = null;
    peer.close();
    peer = null;
  }
  if (stopRemoteCandidates) {
    stopRemoteCandidates();
    stopRemoteCandidates = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  $("localVideo").srcObject = null;
  $("remoteVideo").srcObject = null;
  $("localVideo").style.display = "none";
  $("remoteVideo").style.display = "none";
  $("endCall").disabled = true;
  $("answerCall").disabled = true;
  currentCallId = null;
  currentCallRef = null;
  pendingCandidates = [];
  settingRemoteAnswer = false;
}

async function getMedia(mode) {
  callMode = mode;
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: mode === "video"
  });
  $("localVideo").srcObject = localStream;
  $("localVideo").style.display = mode === "video" ? "block" : "none";
  $("endCall").disabled = false;
}

function makePeer(remoteCandidatePath) {
  peer = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  localStream.getTracks().forEach(track => peer.addTrack(track, localStream));

  peer.ontrack = event => {
    $("remoteVideo").srcObject = event.streams[0];
    $("remoteVideo").style.display =
      (event.streams[0].getVideoTracks().length > 0) ? "block" : "none";
  };

  peer.onicecandidate = async event => {
    if (!event.candidate || !currentCallRef) return;
    try {
      const bucket = remoteCandidatePath === "callerCandidates"
        ? "calleeCandidates" : "callerCandidates";
      await push(ref(db, currentCallRef + "/" + bucket), event.candidate.toJSON());
    } catch (err) {
      console.error("ICE candidate write failed", err);
      callText("Network setup failed. Check Firebase Rules.");
    }
  };

  peer.onconnectionstatechange = () => {
    if (!peer) return;
    const state = peer.connectionState;
    if (state === "connected") callText("Call connected");
    if (state === "failed") callText("Connection failed. A TURN server may be needed.");
    if (state === "disconnected") callText("Call temporarily disconnected");
  };

  stopRemoteCandidates = onChildAdded(
    ref(db, currentCallRef + "/" + remoteCandidatePath),
    async snap => {
      if (!peer || !snap.val()) return;
      try {
        const candidate = new RTCIceCandidate(snap.val());
        if (peer.remoteDescription) {
          await peer.addIceCandidate(candidate);
        } else {
          pendingCandidates.push(candidate);
        }
      } catch (err) {
        console.error("ICE candidate error", err);
      }
    },
    err => {
      console.error(err);
      callText("Cannot receive network signaling. Check Firebase Rules.");
    }
  );
}

async function flushCandidates() {
  if (!peer || !peer.remoteDescription) return;
  for (const candidate of pendingCandidates) {
    try { await peer.addIceCandidate(candidate); }
    catch (err) { console.error(err); }
  }
  pendingCandidates = [];
}

async function startOutgoingCall(mode) {
  if (!user || !db || !activeRoom || !joined) {
    callText("Join a room before calling.");
    return;
  }
  if (!navigator.mediaDevices || !window.RTCPeerConnection) {
    callText("This browser does not support WebRTC calls.");
    return;
  }

  closeMediaOnly();
  try {
    callText("Requesting microphone/camera permission…");
    await getMedia(mode);

    const newCall = push(ref(db, "calls/" + activeRoom));
    currentCallId = newCall.key;
    currentCallRef = callPath(activeRoom, currentCallId);
    makePeer("calleeCandidates");

    const offer = await peer.createOffer();
    await peer.setLocalDescription(offer);

    await set(ref(db, currentCallRef), {
      callerUid: user.uid,
      callerName: $("name").value.trim().slice(0, 24) || "Guest",
      mode,
      status: "ringing",
      offer: { type: offer.type, sdp: offer.sdp },
      createdAt: serverTimestamp()
    });

    // Caller waits for the other participant's answer.
    stopCallDoc = onValue(ref(db, currentCallRef), async snap => {
      const data = snap.val();
      if (!data) return;
      if (data.status === "ended") {
        closeMediaOnly();
        callText("Call ended.");
        return;
      }
      if (data.answer && peer && !settingRemoteAnswer) {
        settingRemoteAnswer = true;
        try {
          await peer.setRemoteDescription(new RTCSessionDescription(data.answer));
          await flushCandidates();
          callText("Connecting call…");
        } catch (err) {
          console.error(err);
          callText("Could not connect the call.");
        }
      }
    });

    $("answerCall").disabled = true;
    $("endCall").disabled = false;
    callText("Calling room members… Ask someone in this room to press Answer Call.");
  } catch (err) {
    console.error("Outgoing call failed", err);
    closeMediaOnly();
    callText("Call could not start. Allow microphone/camera and check Firebase Rules.");
  }
}

async function answerIncomingCall() {
  if (!user || !db || !activeRoom || !seenIncomingCall) return;
  const callId = seenIncomingCall;
  const path = callPath(activeRoom, callId);

  try {
    const snap = await new Promise((resolve, reject) => {
      let stop = onValue(ref(db, path), value => {
        stop();
        resolve(value);
      }, reject);
    });
    const data = snap.val();
    if (!data || data.status !== "ringing" || data.callerUid === user.uid) {
      callText("This call is no longer available.");
      return;
    }

    closeMediaOnly();
    currentCallId = callId;
    currentCallRef = path;
    callText("Joining call…");
    await getMedia(data.mode === "video" ? "video" : "audio");
    makePeer("callerCandidates");

    await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
    await flushCandidates();

    const answer = await peer.createAnswer();
    await peer.setLocalDescription(answer);
    await set(ref(db, path + "/answer"), {
      type: answer.type,
      sdp: answer.sdp
    });
    await set(ref(db, path + "/status"), "answered");

    if (stopCallDoc) stopCallDoc();
    stopCallDoc = onValue(ref(db, path + "/status"), statusSnap => {
      if (statusSnap.val() === "ended") {
        closeMediaOnly();
        callText("Call ended.");
      }
    });

    seenIncomingCall = "";
    $("answerCall").disabled = true;
    $("endCall").disabled = false;
    callText("Answer sent. Connecting…");
  } catch (err) {
    console.error("Answer call failed", err);
    closeMediaOnly();
    callText("Could not answer. Check microphone/camera permission and Firebase Rules.");
  }
}

async function endCurrentCall() {
  const path = currentCallRef;
  closeMediaOnly();
  if (stopCallDoc) {
    stopCallDoc();
    stopCallDoc = null;
  }
  if (path && db) {
    try { await set(ref(db, path + "/status"), "ended"); }
    catch (err) { console.error("Could not end call in database", err); }
  }
  callText("Call ended.");
}

function watchRoomCalls(room) {
  if (stopCallList) {
    stopCallList();
    stopCallList = null;
  }
  seenIncomingCall = "";
  $("answerCall").disabled = true;
  callText("Ready. Join a room member's call or start one.");

  stopCallList = onValue(ref(db, "calls/" + room), snap => {
    let incoming = null;
    snap.forEach(child => {
      const data = child.val() || {};
      if (data.status === "ringing" && data.callerUid !== user.uid && !data.answer) {
        incoming = { id: child.key, name: data.callerName || "Guest", mode: data.mode || "audio" };
      }
    });

    if (incoming && !currentCallId) {
      seenIncomingCall = incoming.id;
      $("answerCall").disabled = false;
      $("answerCall").textContent =
        "Answer " + (incoming.mode === "video" ? "Video" : "Audio") + " Call from " + incoming.name;
      callText("Incoming call from " + incoming.name);
    } else if (!currentCallId) {
      seenIncomingCall = "";
      $("answerCall").disabled = true;
      $("answerCall").textContent = "Answer Call";
    }
  }, err => {
    console.error("Call room listener failed", err);
    callText("Cannot load calls. Check Firebase Rules.");
  });
}

$("startAudioCall").addEventListener("click", () => startOutgoingCall("audio"));
$("startVideoCall").addEventListener("click", () => startOutgoingCall("video"));
$("answerCall").addEventListener("click", answerIncomingCall);
$("endCall").addEventListener("click", endCurrentCall);

// Hook into either the Random Rooms join function or the original Join form.
if (typeof joinRoom === "function") {
  const originalJoinRoom = joinRoom;
  joinRoom = function(roomId, roomName) {
    originalJoinRoom(roomId, roomName);
    watchRoomCalls(roomId);
  };
}
const joinFormForCalls = $("joinForm");
if (joinFormForCalls) {
  joinFormForCalls.addEventListener("submit", () => {
    setTimeout(() => {
      if (activeRoom) watchRoomCalls(activeRoom);
    }, 0);
  });
}

</script>

   display:inline-block;padding:10px 16px;background:#6d28d9;
   color:#fff;text-decoration:none;border-radius:10px;
   font-weight:700;font-family:Arial,sans-serif;
   box-shadow:0 2px 8px #0003">
